name: SparkGuardian Audit

# Report-only audit: runs SparkGuardian, publishes a Markdown summary + SARIF,
# and always finishes green. The analysis exit code is captured and shown in the
# job summary, but it does NOT fail the workflow (gating is opt-in, see below).

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install SparkGuardian
        run: pip install .

      - name: Run SparkGuardian audit (report-only)
        id: audit
        run: |
          set +e
          sparkguardian analyze examples/ \
            --md sparkguardian-report.md \
            --sarif sparkguardian.sarif
          code=$?
          set -e
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          echo "SparkGuardian analyze exit code: $code (report-only, findings do not gate)"
          # Honest green: pass whatever the findings are (exit 1/2), but fail if
          # the tool produced no report at all (a real error, not findings).
          if [ ! -f sparkguardian-report.md ] || [ ! -f sparkguardian.sarif ]; then
            echo "::error::SparkGuardian produced no report (analyze failed)"
            exit 1
          fi

      - name: Publish report to job summary
        if: always()
        run: |
          if [ -f sparkguardian-report.md ]; then
            cat sparkguardian-report.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No report generated." >> "$GITHUB_STEP_SUMMARY"
          fi

      # SARIF is kept as a downloadable artifact below. To also publish it to the
      # GitHub Security tab, enable Code Scanning on the repo (public repo, or
      # GitHub Advanced Security) then add back a github/codeql-action/upload-sarif
      # step with `security-events: write` permission.
      - name: Upload report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sparkguardian-report
          path: |
            sparkguardian-report.md
            sparkguardian.sarif
          if-no-files-found: warn

  # ---------------------------------------------------------------------------
  # Optional gate. Disabled by default so the main audit stays green.
  # Flip `if: false` -> `if: true` to make CI fail on CRITICAL findings.
  # ---------------------------------------------------------------------------
  gate:
    if: false
    runs-on: ubuntu-latest
    needs: audit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install .
      - name: Fail on critical findings
        run: sparkguardian analyze examples/
