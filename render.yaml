# Render.com blueprint — one-click deploy of the SparkGuardian licensing portal.
# https://render.com/docs/blueprint-spec
services:
  - type: web
    name: sparkguardian-portal
    runtime: docker
    dockerfilePath: ./application/Dockerfile
    dockerContext: ./application
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: SECRET_KEY          # token-signing secret
        generateValue: true
      - key: ADMIN_TOKEN         # protects /admin
        generateValue: true
      - key: DATABASE_PATH       # persisted on the disk below
        value: /data/sparkguardian.db
      - key: PUBLIC_URL          # set to your Render URL after first deploy
        sync: false
      - key: STRIPE_SECRET_KEY   # test-mode keys; leave blank to disable billing
        sync: false
      - key: STRIPE_PRICE_ID
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
    disk:                        # keeps the SQLite DB across deploys/restarts
      name: data
      mountPath: /data
      sizeGB: 1
