[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sparkguardian"
dynamic = ["version"]
description = "Production-grade PySpark auditing, optimization, and governance framework — static + dynamic analysis with local AI assistance"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "SparkGuardian Contributors" }]
maintainers = [{ name = "SparkGuardian Contributors" }]
keywords = [
    "spark",
    "pyspark",
    "linter",
    "static-analysis",
    "optimizer",
    "governance",
    "ci-cd",
    "data-engineering",
    "big-data",
    "sarif",
    "performance",
    "anti-pattern",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Software Development :: Code Generators",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Typing :: Typed",
]

dependencies = [
    "libcst>=1.1.0",
    "typer>=0.12.0",
    "rich>=13.7.0",
    "pydantic>=2.6.0",
    "pyyaml>=6.0.1",
    "jinja2>=3.1.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
ai = ["ollama>=0.1.7"]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "mypy>=1.9.0",
    "ruff>=0.4.0",
    "build>=1.2.0",
    "twine>=5.0.0",
]
all = ["sparkguardian[ai,dev]"]

[project.scripts]
sparkguardian = "sparkguardian.cli:app"

[project.urls]
Homepage = "https://github.com/MohamedDataX/sparkguardian"
Documentation = "https://github.com/MohamedDataX/sparkguardian#readme"
Repository = "https://github.com/MohamedDataX/sparkguardian"
Issues = "https://github.com/MohamedDataX/sparkguardian/issues"
Changelog = "https://github.com/MohamedDataX/sparkguardian/blob/main/CHANGELOG.md"

# ---------------------------------------------------------------------------
# Hatch — build + version sourced from sparkguardian/__init__.py
# ---------------------------------------------------------------------------

[tool.hatch.version]
path = "sparkguardian/constants.py"
pattern = 'APP_VERSION = "(?P<version>[^"]+)"'

[tool.hatch.build.targets.wheel]
packages = ["sparkguardian"]

[tool.hatch.build.targets.sdist]
include = [
    "/sparkguardian",
    "/tests",
    "/examples",
    "/README.md",
    "/DEMO.md",
    "/LICENSE",
    "/pyproject.toml",
]
exclude = [
    "/.github",
    "/.pytest_cache",
    "/.claude",
    "/.sparkguardian-history.json",
    "/prompt.md",
    "**/__pycache__",
    "**/*.pyc",
]

# ---------------------------------------------------------------------------
# Linting + formatting
# ---------------------------------------------------------------------------

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B"]
ignore = ["UP042"]

[tool.ruff.lint.per-file-ignores]
"sparkguardian/rules/static_rules.py" = ["N802"]
"sparkguardian/rewriter/transformer.py" = ["N802"]

# ---------------------------------------------------------------------------
# Type checking
# ---------------------------------------------------------------------------

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

# ---------------------------------------------------------------------------
# Test runner
# ---------------------------------------------------------------------------

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--tb=short"
