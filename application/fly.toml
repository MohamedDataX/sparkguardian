# Fly.io config for the SparkGuardian licensing portal.
# Deploy: fly deploy   (run from this application/ dir)
app = "sparkguardian-portal"
primary_region = "cdg"  # Paris

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8000"
  DATABASE_PATH = "/data/sparkguardian.db"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "stop"   # sleep when idle (free-friendly)
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "15s"
    method = "GET"
    path = "/api/health"

# Persistent volume -> SQLite survives restarts/redeploys.
[[mounts]]
  source = "data"
  destination = "/data"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
